<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 280" fill="none">
  <defs>
    <!-- Gradients -->
    <linearGradient id="goldMesh" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFEBB0" />
      <stop offset="40%" stop-color="#E9AC3F" />
      <stop offset="75%" stop-color="#CA8A04" />
      <stop offset="100%" stop-color="#9A6507" />
    </linearGradient>

    <linearGradient id="cyanSignal" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="50%" stop-color="#60A5FA" />
      <stop offset="100%" stop-color="#2563EB" />
    </linearGradient>

    <linearGradient id="glowRing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#E9AC3F" stop-opacity="0.2" />
    </linearGradient>

    <linearGradient id="mountainDark" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#0B132B" />
    </linearGradient>

    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.65" />
    </filter>
  </defs>

  <g filter="url(#softShadow)">
    <!-- Radar / Mesh Concentric Waves -->
    <path d="M 190 95 A 70 70 0 0 1 330 95" stroke="url(#cyanSignal)" stroke-width="1.8" stroke-dasharray="4 4" opacity="0.45" />
    <path d="M 170 95 A 90 90 0 0 1 350 95" stroke="url(#cyanSignal)" stroke-width="2" stroke-dasharray="6 6" opacity="0.65" />
    <path d="M 150 95 A 110 110 0 0 1 370 95" stroke="url(#cyanSignal)" stroke-width="2.2" stroke-opacity="0.85" />

    <!-- Sensor / Mesh Triangulation Web -->
    <line x1="260" y1="28" x2="215" y2="65" stroke="#38BDF8" stroke-width="1.2" opacity="0.7" />
    <line x1="260" y1="28" x2="305" y2="65" stroke="#38BDF8" stroke-width="1.2" opacity="0.7" />
    <line x1="215" y1="65" x2="305" y2="65" stroke="#38BDF8" stroke-width="1.2" opacity="0.5" />
    <line x1="215" y1="65" x2="260" y2="92" stroke="#38BDF8" stroke-width="1.2" opacity="0.6" />
    <line x1="305" y1="65" x2="260" y2="92" stroke="#38BDF8" stroke-width="1.2" opacity="0.6" />
    <line x1="260" y1="28" x2="260" y2="92" stroke="url(#goldMesh)" stroke-width="1.5" opacity="0.8" />

    <!-- Pulse nodes on mesh -->
    <circle cx="260" cy="28" r="4.5" fill="#38BDF8" filter="url(#neonGlow)" />
    <circle cx="260" cy="28" r="2.5" fill="#FFFFFF" />
    
    <circle cx="215" cy="65" r="3.5" fill="#38BDF8" />
    <circle cx="215" cy="65" r="1.8" fill="#FFFFFF" />

    <circle cx="305" cy="65" r="3.5" fill="#38BDF8" />
    <circle cx="305" cy="65" r="1.8" fill="#FFFFFF" />

    <!-- Central Shield / Apex Crest -->
    <path d="M 260 48 L 298 72 L 298 108 C 298 128 260 148 260 148 C 260 148 222 128 222 108 L 222 72 Z"
          fill="url(#mountainDark)" stroke="url(#goldMesh)" stroke-width="3" />

    <!-- Mountain Peaks inside Crest with Landslide Contour Warning -->
    <path d="M 230 114 L 246 88 L 260 102 L 274 80 L 290 114 Z" fill="#0E1A30" />
    <path d="M 246 88 L 260 102 L 274 80" stroke="url(#goldMesh)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
    <polygon points="260,102 274,80 286,110 260,110" fill="url(#goldMesh)" opacity="0.25" />

    <!-- Hazard / AI Signal Pulse in Crest -->
    <circle cx="260" cy="120" r="4" fill="#EF4444" filter="url(#neonGlow)" />
    <circle cx="260" cy="120" r="2" fill="#FFF" />

    <!-- Outer Wings / Telemetry Fins -->
    <path d="M 215 82 L 182 92 L 195 106 L 215 100 Z" fill="url(#goldMesh)" opacity="0.9" />
    <path d="M 182 92 L 155 100 L 172 114 L 195 106 Z" fill="url(#goldMesh)" opacity="0.7" />

    <path d="M 305 82 L 338 92 L 325 106 L 305 100 Z" fill="url(#goldMesh)" opacity="0.9" />
    <path d="M 338 92 L 365 100 L 348 114 L 325 106 Z" fill="url(#goldMesh)" opacity="0.7" />

    <!-- Main Title Typography: SIGNALMESH AI -->
    <g transform="translate(260, 192)" text-anchor="middle">
      <text font-family="'Inter', 'Poppins', system-ui, -apple-system, sans-serif" font-weight="900" font-size="34" letter-spacing="3" fill="#FFFFFF">
        SIGNAL<tspan fill="url(#goldMesh)">MESH</tspan>
        <tspan dx="10" fill="#38BDF8" font-size="28" font-weight="800">AI</tspan>
      </text>
    </g>

    <!-- Subtitle: LANDSLIDE RISK MONITORING SYSTEM -->
    <g transform="translate(260, 218)" text-anchor="middle">
      <text font-family="'Inter', system-ui, sans-serif" font-weight="600" font-size="10.5" letter-spacing="4.5" fill="#94A3B8">
        LANDSLIDE RISK &amp; EARLY WARNING
      </text>
    </g>

    <!-- Team Badge / Hall-mark -->
    <g transform="translate(260, 246)" text-anchor="middle">
      <!-- Background Pill -->
      <rect x="-75" y="-12" width="150" height="22" rx="11" fill="rgba(37, 99, 235, 0.16)" stroke="rgba(56, 189, 248, 0.4)" stroke-width="1" />
      <circle cx="-56" cy="-1" r="3" fill="#38BDF8" />
      <text font-family="'Inter', system-ui, sans-serif" font-weight="700" font-size="9" letter-spacing="1.8" fill="#38BDF8" y="2.5" dx="6">
        APEX-AI-X
      </text>
    </g>
  </g>
</svg>
